<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow" />
<script src="/siteCookies.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — CRITERIA</title>
<link rel="icon" href="Tools/Logo Black.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#f0a500;--gold-border:rgba(240,165,0,0.25);--gold-glow:rgba(240,165,0,0.12);
  --bg:#080808;--bg-2:#0f0f0f;--bg-3:#161616;--bg-card:#111111;
  --text:#f5f5f5;--text-2:#999;--text-3:#555;
  --border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.13);
  --error:#ef4444;--success:#22c55e;
  --font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
  --radius:16px;--transition:0.3s cubic-bezier(0.25,0.46,0.45,0.94);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;padding:2rem;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(240,165,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(240,165,0,0.03) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent);pointer-events:none;}
::selection{background:var(--gold);color:#000;}

.loading-screen{position:fixed;inset:0;z-index:9998;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.25rem;transition:opacity 0.4s ease,visibility 0.4s ease;}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.loading-spinner{width:46px;height:46px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-status{font-size:0.78rem;color:var(--text-2);text-transform:uppercase;letter-spacing:0.14em;}

#notif-container{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:0.6rem;pointer-events:none;}
.notif-toast{background:var(--bg-3);border:1px solid var(--border);border-radius:14px;padding:12px 18px;font-size:0.88rem;color:var(--text);display:flex;align-items:center;gap:0.75rem;opacity:0;transform:translateY(-40px);transition:all 0.35s var(--transition);pointer-events:auto;}
.notif-toast.show{opacity:1;transform:translateY(0);}
.notif-toast.error{border-color:rgba(239,68,68,0.4);color:var(--error);}
.notif-toast.success{border-color:rgba(34,197,94,0.4);color:var(--success);}
.notif-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.login-shell{width:min(480px,100%);background:var(--bg-3);border:1px solid var(--border-hover);border-radius:28px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.5);}
.login-panel{padding:3rem;display:flex;flex-direction:column;gap:1.5rem;}
.login-brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:800;font-size:1.1rem;letter-spacing:0.25em;}
.logo-dot{width:9px;height:9px;background:var(--gold);border-radius:50%;animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:0.6;}}
.login-heading{font-family:var(--font-display);font-size:1.8rem;font-weight:800;line-height:1.1;margin-bottom:0.4rem;}
.login-copy{color:var(--text-2);font-size:0.88rem;line-height:1.7;}
.field-label{font-size:0.72rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-2);margin-bottom:0.45rem;display:block;}
.auth-input{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:0.92rem;font-family:var(--font-body);transition:border-color var(--transition),box-shadow var(--transition);outline:none;}
.auth-input:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(240,165,0,0.06);}
.auth-button{width:100%;background:var(--gold);color:#000;border:none;border-radius:100px;padding:14px 18px;font-family:var(--font-display);font-weight:700;font-size:0.92rem;letter-spacing:0.08em;cursor:pointer;transition:all var(--transition);}
.auth-button:hover:not(:disabled){background:var(--gold-hover);transform:translateY(-1px);}
.auth-button:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
.auth-error{padding:12px 16px;border-radius:12px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:var(--error);font-size:0.86rem;display:none;}
.auth-error.show{display:block;}
.login-footer{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--text-3);padding-top:0.5rem;}
.login-link{color:var(--gold);text-decoration:none;transition:color var(--transition);}
.login-link:hover{color:var(--gold-hover);}

/* CHANGE CREDENTIALS PANEL */
.change-panel{display:none;flex-direction:column;gap:1.25rem;padding-top:1rem;border-top:1px solid var(--border);}
.change-panel.open{display:flex;}
.change-panel-title{font-family:var(--font-display);font-weight:700;font-size:0.9rem;color:var(--text-2);}
@media(max-width:640px){.login-panel{padding:2rem;}}
@media(max-width:480px){
  body{padding:12px;}
  .login-shell{border-radius:18px;}
  .login-panel{padding:1.5rem 1.1rem;gap:1.2rem;}
  .login-heading{font-size:1.4rem;}
  .auth-input{font-size:16px;padding:12px 14px;}
  .notif-toast{max-width:calc(100vw - 24px);padding:10px 14px;font-size:0.8rem;}
}
@media(max-width:360px){
  .login-panel{padding:1.25rem 0.85rem;}
}
</style>
</head>
<body>
<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-status" id="loading-status">Connecting</div>
</div>
<div id="notif-container"></div>

<div class="login-shell">
  <div class="login-panel">
    <div class="login-brand"><div class="logo-dot"></div>CRITERIA ADMIN</div>
    <div>
      <h1 class="login-heading">Admin Access</h1>
      <p class="login-copy">Studio control panel. Restricted access only.</p>
    </div>

    <div id="error-box" class="auth-error"></div>

    <div>
      <label class="field-label">Username</label>
      <input id="username" class="auth-input" type="password" placeholder="Enter username" autocomplete="off"/>
    </div>
    <div>
      <label class="field-label">Password</label>
      <input id="password" class="auth-input" type="password" placeholder="Enter password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')adminSignIn()"/>
    </div>

    <button id="login-btn" class="auth-button" onclick="adminSignIn()">Sign In</button>

    <div class="login-footer">
      <span>CRITERIA Studio</span>
      <a href="/" class="login-link">Return to site →</a>
    </div>

    <!-- CHANGE CREDENTIALS (shown after login from admin panel link) -->
    <div class="change-panel" id="change-panel">
      <div class="change-panel-title">Change Credentials</div>
      <div id="change-error" class="auth-error"></div>
      <div>
        <label class="field-label">Current Password (required)</label>
        <input id="cur-pass" class="auth-input" type="password" placeholder="Current password"/>
      </div>
      <div>
        <label class="field-label">New Username (leave blank to keep)</label>
        <input id="new-username" class="auth-input" type="text" placeholder="New username"/>
      </div>
      <div>
        <label class="field-label">New Password (leave blank to keep)</label>
        <input id="new-pass" class="auth-input" type="password" placeholder="New password"/>
      </div>
      <button class="auth-button" onclick="changeCredentials()">Update Credentials</button>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp }      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ════════════════════════════════════
// NEW FIREBASE CONFIG (Admin App)
// ════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC5PXHOl3UYhsWImZBKXYXbikYASWVC-7Y",
  authDomain: "criteria-18e9d.firebaseapp.com",
  projectId: "criteria-18e9d",
  storageBucket: "criteria-18e9d.firebasestorage.app",
  messagingSenderId: "427729441325",
  appId: "1:427729441325:web:6b9d30862cc6e1d5c65ea4",
  measurementId: "G-BXTE9Y035G"
};


const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// Default credentials stored in Firestore under meta/adminCredentials
// On first run, these defaults are used if the doc doesn't exist yet.
const DEFAULT_USERNAME = '13.8.16.11';
const DEFAULT_PASSWORD = '20.13.3';

function hideLoading() {
  document.getElementById('loading-status').textContent = 'Ready';
  setTimeout(() => document.getElementById('loading-screen').classList.add('hidden'), 400);
}

async function getCredentials() {
  try {
    const snap = await getDoc(doc(db, 'meta', 'adminCredentials'));
    if (snap.exists()) return snap.data();
  } catch(e) {}
  return { username: DEFAULT_USERNAME, password: DEFAULT_PASSWORD };
}

// ── AUTH STATE ──
let redirected = false;

onAuthStateChanged(auth, async (user) => {
  const params = new URLSearchParams(window.location.search);

  if (
    user &&
    localStorage.getItem('criteria-admin-auth') === '1' &&
    !redirected &&
    params.get('change') !== '1'
  ) {
    redirected = true;
    window.location.replace('/admin');
    return;
  }

  if (
    user &&
    localStorage.getItem('criteria-admin-auth') === '1' &&
    params.get('change') === '1'
  ) {
    document.getElementById('change-panel').classList.add('open');
  }

  hideLoading();
});
// ── SIGN IN ──
window.adminSignIn = async function() {
  clearError();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { showError('Enter both username and password.'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const creds = await getCredentials();
    if (username !== creds.username || password !== creds.password) {
      throw new Error('Incorrect username or password.');
    }
    // Sign in anonymously — credentials validated above
    try {
      await signInAnonymously(auth);
    } catch(authErr) {
      console.warn('Anonymous signin notice:', authErr);
    }
    // Store session flag in localStorage
    localStorage.setItem('criteria-admin-auth', '1');
    window.location.href = '/admin';
  } catch(e) {
    showError(e.message || 'Sign in failed.');
    showNotif('Access denied', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

// ── CHANGE CREDENTIALS ──
window.changeCredentials = async function() {
  clearChangeError();
  const curPass  = document.getElementById('cur-pass').value;
  const newUser  = document.getElementById('new-username').value.trim();
  const newPass  = document.getElementById('new-pass').value;

  if (!curPass) { showChangeError('Current password is required.'); return; }

  const creds = await getCredentials();
  if (curPass !== creds.password) { showChangeError('Current password is incorrect.'); return; }

  const updated = {
    username: newUser || creds.username,
    password: newPass || creds.password
  };
  try {
    await setDoc(doc(db, 'meta', 'adminCredentials'), updated);
    showNotif('Credentials updated!', 'success');
    document.getElementById('cur-pass').value  = '';
    document.getElementById('new-username').value = '';
    document.getElementById('new-pass').value  = '';
  } catch(e) {
    showChangeError(e.message || 'Update failed.');
  }
};

function showError(msg)       { const el = document.getElementById('error-box'); el.textContent = msg; el.classList.add('show'); }
function clearError()         { const el = document.getElementById('error-box'); el.textContent = ''; el.classList.remove('show'); }
function showChangeError(msg) { const el = document.getElementById('change-error'); el.textContent = msg; el.classList.add('show'); }
function clearChangeError()   { const el = document.getElementById('change-error'); el.textContent = ''; el.classList.remove('show'); }

function showNotif(msg, type='') {
  const c = document.getElementById('notif-container');
  const t = document.createElement('div');
  t.className = `notif-toast ${type}`;
  t.innerHTML = `<span class="notif-dot"></span>${msg}`;
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3800);
}
</script>
</body>
</html>
