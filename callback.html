<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in — CRITERIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem;
    }
    .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.25em; display: flex; align-items: center; gap: 8px; }
    .dot { width: 7px; height: 7px; background: #f0a500; border-radius: 50%; }
    .spinner { width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.07); border-top-color: #f0a500; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.8rem; color: #aaa; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 1rem 1.5rem; font-size: 0.85rem; color: #ef4444; text-align: center; max-width: 440px; display: none; line-height: 1.5; }
    @media(max-width:480px){
      .logo{font-size:1rem;}
      .error-box{max-width:90%; font-size:0.8rem; padding:0.875rem 1.25rem;}
    }
  </style>
</head>
<body>
  <div class="logo"><div class="dot"></div>CRITERIA</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Completing Google sign-in...</div>
  <div class="error-box" id="error-box"></div>

  <script type="module">
    // If incoming request is from GitHub OAuth, forward directly to /auth/callback
    const _urlParams = new URLSearchParams(window.location.search);
    const _ghCode = _urlParams.get('code');
    const _ghState = _urlParams.get('state');
    if (_ghCode && (_ghState?.startsWith('gh_') || !_urlParams.get('id_token'))) {
      window.location.replace('/auth/callback' + window.location.search);
    }

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithCredential, fetchSignInMethodsForEmail, signInWithEmailAndPassword, linkWithCredential }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyC5PXHOl3UYhsWImZBKXYXbikYASWVC-7Y",
      authDomain: "criteria-18e9d.firebaseapp.com",
      projectId: "criteria-18e9d",
      storageBucket: "criteria-18e9d.firebasestorage.app",
      messagingSenderId: "427729441325",
      appId: "1:427729441325:web:43a77167bd1f9fc5c65ea4"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const setStatus = (msg) => {
      const el = document.getElementById('status');
      if (el) el.textContent = msg;
    };

    function decodeJwtEmail(idToken) {
      if (!idToken) return null;
      try {
        const payload = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return payload.email || null;
      } catch (e) { return null; }
    }

    function showAccountConflictChoice(email) {
      return new Promise(resolve => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        const box = document.createElement('div');
        box.style.cssText = 'max-width:420px;text-align:center;display:flex;flex-direction:column;gap:1rem;';
        box.innerHTML = `
          <div style="font-size:0.9rem;line-height:1.6;">
            An account for <strong>${email}</strong> already exists. 
            Would you like to link your Google account to it? Enter your password to confirm.
          </div>
          <input type="password" id="link-password-input" placeholder="Password" style="padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;width:100%;margin-bottom:10px;">
          <div style="display:flex;gap:0.75rem;justify-content:center;">
            <button id="cancel-link-btn" style="padding:10px 18px;border-radius:100px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#fff;cursor:pointer;">Cancel</button>
            <button id="link-google-btn" style="padding:10px 18px;border-radius:100px;border:none;background:#f0a500;color:#000;font-weight:700;cursor:pointer;">Link Accounts</button>
          </div>`;
        document.body.appendChild(box);
        document.getElementById('cancel-link-btn').onclick = () => { box.remove(); resolve({ choice: 'cancel' }); };
        document.getElementById('link-google-btn').onclick = () => { 
          const pwd = document.getElementById('link-password-input').value;
          box.remove(); 
          resolve({ choice: 'link', password: pwd }); 
        };
      });
    }

    const showError = (msg) => {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
      setTimeout(() => {
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', message: msg }, '*');
          } catch(e) {}
          window.close();
        } else {
          window.location.href = '/';
        }
      }, 4000);
    };

    async function handleCallback() {
      try {
        const hashStr = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
        const hashParams = new URLSearchParams(hashStr);
        const searchParams = new URLSearchParams(window.location.search);

        // Check for error from Google
        const error = hashParams.get('error') || searchParams.get('error');
        if (error) {
          const errDesc = hashParams.get('error_description') || searchParams.get('error_description') || error;
          showError(`Google sign-in cancelled: ${errDesc}`);
          return;
        }

        const idToken     = hashParams.get('id_token') || searchParams.get('id_token');
        const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
        const returnedState = hashParams.get('state') || searchParams.get('state');

        const savedState = sessionStorage.getItem('google_oauth_state') || localStorage.getItem('google_oauth_state');
        if (savedState && returnedState && savedState !== returnedState) {
          showError('Security check failed. Please try signing in again.');
          return;
        }

        sessionStorage.removeItem('google_oauth_state');
        localStorage.removeItem('google_oauth_state');

        if (!idToken && !accessToken) {
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (!isLocal) {
            window.location.href = '/';
            return;
          }
          setStatus('No Google token received. Redirecting to home...');
          setTimeout(() => { window.location.href = '/'; }, 2000);
          return;
        }

        setStatus('Authenticating with CRITERIA...');

        // Direct Google Cloud OAuth credential for Firebase Auth
        const firebaseCred = GoogleAuthProvider.credential(idToken, accessToken);
        let user;

        const googleEmail = decodeJwtEmail(idToken);
        if (googleEmail) {
          try {
            const methods = await fetchSignInMethodsForEmail(auth, googleEmail);
            if (methods.includes('password') && !methods.includes('google.com')) {
              const result = await showAccountConflictChoice(googleEmail);
              if (result.choice === 'cancel') {
                showError('Sign in cancelled.');
                return;
              } else if (result.choice === 'link') {
                setStatus('Linking your accounts...');
                try {
                  const pwResult = await signInWithEmailAndPassword(auth, googleEmail, result.password);
                  const linkedResult = await linkWithCredential(pwResult.user, firebaseCred);
                  user = linkedResult.user;
                } catch (e) {
                  showError('Failed to link accounts: ' + e.message);
                  return;
                }
              }
            }
          } catch(checkErr) {
            console.warn('Account check notice:', checkErr);
          }
        }

        if (!user) {
          const signinResult = await signInWithCredential(auth, firebaseCred);
          user = signinResult.user;
        }

        // Save/update user profile in Firestore
        try {
          await setDoc(doc(db, 'users', user.uid), {
            displayName: user.displayName || '',
            email:       user.email       || '',
            photoURL:    user.photoURL    || '',
            provider:    'google',
            emailVerifiedCustom: true,
            lastLogin:   serverTimestamp()
          }, { merge: true });
        } catch(dbErr) {
          console.warn('Firestore user update notice:', dbErr);
        }

        setStatus('Signed in! Closing...');

        // Notify opener (if popup) or redirect to destination
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', uid: user.uid }, '*');
          } catch(postErr) {
            console.warn('postMessage notice:', postErr);
          }
          setTimeout(() => window.close(), 600);
        } else {
          let redirectTo = sessionStorage.getItem('google_oauth_redirect') || localStorage.getItem('google_oauth_redirect') || '/';
          sessionStorage.removeItem('google_oauth_redirect');
          localStorage.removeItem('google_oauth_redirect');
          if (redirectTo.endsWith('.html')) redirectTo = redirectTo.slice(0, -5);
          if (redirectTo === '/index' || redirectTo === 'index') redirectTo = '/';
          window.location.href = redirectTo;
        }

      } catch (err) {
        console.error('Callback error:', err);
        showError(`Sign-in failed: ${err.message}`);
      }
    }

    handleCallback();
  </script>
</body>
</html>
